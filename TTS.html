<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한영 번역 · 발음 듣기</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e3e1da;--us:#2b5bd7;--uk:#b3263e;--acc:#1d1d1b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--ink:#f1efe8;--mute:#9b9a93;--line:#34332f;--us:#7ea2ff;--uk:#ff8a9d;--acc:#f1efe8}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--ink:#f1efe8;--mute:#9b9a93;--line:#34332f;--us:#7ea2ff;--uk:#ff8a9d;--acc:#f1efe8}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;letter-spacing:.02em}
textarea{width:100%;border:0;outline:0;resize:vertical;background:transparent;color:var(--ink);font:inherit;font-size:17px;min-height:84px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button:disabled{opacity:.5;cursor:default}
.primary{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
.spacer{flex:1}
#out{font-size:20px;min-height:60px}
.voices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.v{padding:14px 10px;font-weight:600;border-width:2px}
.v.us{color:var(--us);border-color:var(--us)}
.v.uk{color:var(--uk);border-color:var(--uk)}
.v small{display:block;font-weight:400;color:var(--mute);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v.on{background:currentColor}
.v.on span,.v.on small{color:var(--bg)}
select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.msg{font-size:13px;color:var(--mute);margin-top:8px;min-height:18px}
.err{color:var(--uk)}
</style>
</head>
<body>
<main>
  <h1>🗣️ 한영 번역 · 발음 듣기</h1>
  <p class="sub">한국어를 입력하면 영어로 번역하고, 미국식·영국식 발음으로 들려줘요.</p>

  <div class="card">
    <label for="src">한국어</label>
    <textarea id="src" placeholder="예: 오늘 날씨가 정말 좋네요." lang="ko"></textarea>
    <div class="row">
      <span class="msg" id="hint">Ctrl/⌘ + Enter 로 번역</span>
      <span class="spacer"></span>
      <button id="clear">지우기</button>
      <button id="go" class="primary">번역하기</button>
    </div>
  </div>

  <div class="card">
    <label for="out">English (직접 수정해서 들어볼 수도 있어요)</label>
    <textarea id="out" lang="en" placeholder="번역 결과가 여기에 나타나요."></textarea>
    <div class="voices">
      <button class="v us" id="us"><span>🇺🇸 미국식 발음</span><small id="usName">-</small></button>
      <button class="v uk" id="uk"><span>🇬🇧 영국식 발음</span><small id="ukName">-</small></button>
    </div>
    <div class="row" style="margin-top:12px">
      <label for="rate" style="margin:0">속도</label>
      <select id="rate">
        <option value="0.7">느리게</option>
        <option value="0.9">조금 느리게</option>
        <option value="1" selected>보통</option>
        <option value="1.15">조금 빠르게</option>
      </select>
      <span class="spacer"></span>
      <button id="stop">⏹ 정지</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const src = $("src"), out = $("out"), msg = $("msg");
const synth = window.speechSynthesis;
let voices = [];

function setMsg(t, err){ msg.textContent = t || ""; msg.className = "msg" + (err ? " err" : ""); }

/* ---------- 음성 선택 ---------- */
function norm(l){ return (l || "").replace("_", "-").toLowerCase(); }
function pick(lang){
  const l = lang.toLowerCase();
  const m = voices.filter(v => norm(v.lang) === l);
  return m.find(v => /google|natural|enhanced|premium/i.test(v.name)) || m[0] || null;
}
function refreshVoices(){
  if(!synth) return;
  voices = synth.getVoices();
  const us = pick("en-US"), uk = pick("en-GB");
  $("usName").textContent = us ? us.name : "기본 음성 사용";
  $("ukName").textContent = uk ? uk.name : "영국 음성 없음";
}
if(synth){ refreshVoices(); synth.onvoiceschanged = refreshVoices; }
else setMsg("이 브라우저는 음성 합성을 지원하지 않아요.", true);

function speak(lang, btn){
  const text = out.value.trim();
  if(!text){ setMsg("먼저 번역하거나 영어 문장을 입력해 주세요.", true); return; }
  if(!synth) return;
  synth.cancel();
  document.querySelectorAll(".v").forEach(b => b.classList.remove("on"));
  const u = new SpeechSynthesisUtterance(text);
  const v = pick(lang);
  if(v) u.voice = v;
  u.lang = lang;
  u.rate = parseFloat($("rate").value);
  u.onstart = () => btn.classList.add("on");
  u.onend = u.onerror = () => btn.classList.remove("on");
  if(lang === "en-GB" && !v) setMsg("이 기기에 영국식 음성이 없어서 기본 음성으로 재생될 수 있어요. 기기 설정에서 영국 영어 음성을 추가해 보세요.");
  else setMsg("");
  synth.speak(u);
}
$("us").onclick = e => speak("en-US", e.currentTarget);
$("uk").onclick = e => speak("en-GB", e.currentTarget);
$("stop").onclick = () => { synth && synth.cancel(); document.querySelectorAll(".v").forEach(b => b.classList.remove("on")); };

/* ---------- 번역 (Claude) ---------- */
let busy = false, ctrl = null;
const ERR = {
  not_granted: "Claude 사용 권한이 허용되지 않았어요. 다시 시도해서 허용을 눌러 주세요.",
  sampling_disabled: "이 계정에서는 번역 기능(Claude)을 쓸 수 없어요.",
  not_declared: "이 페이지에 번역 권한이 설정되지 않았어요. 페이지를 새로고침해 보세요.",
  capability_disabled: "이 화면에서는 번역 기능을 쓸 수 없어요.",
  rate_limited: "요청이 너무 많거나 사용 한도에 도달했어요. 잠시 후 다시 시도해 주세요.",
  session_expired: "로그인이 만료됐어요. claude.ai에 다시 로그인해 주세요.",
  refused: "이 문장은 번역할 수 없었어요. 문장을 바꿔서 다시 시도해 주세요.",
  empty_completion: "번역 결과가 비어 있어요. 다시 시도해 주세요.",
  upstream_error: "일시적인 연결 문제예요. 잠시 후 다시 시도해 주세요."
};
async function getSample(){
  if(typeof claude === "undefined" || !claude || !claude.use) return null;
  try{ return await claude.use("sample"); }catch(e){ return null; }
}
async function translate(){
  const text = src.value.trim();
  if(!text || busy) return;
  busy = true; $("go").disabled = true; $("go").textContent = "번역 중…";
  setMsg("번역 중… (처음엔 권한 허용 창이 뜰 수 있어요)"); out.value = "";
  try{
    const sample = await getSample();
    if(!sample){
      setMsg("번역 기능을 불러오지 못했어요. claude.ai의 아티팩트 링크로 열고, 로그인한 상태인지 확인해 주세요.", true);
      return;
    }
    ctrl = new AbortController();
    const prompt = "Translate the following Korean text into natural, fluent English. " +
      "Output ONLY the English translation, with no quotes, notes or explanations. " +
      "If the text is already English, output it unchanged.\n\nKorean text:\n" + text;
    const r = await sample(prompt, { cache:false, signal: ctrl.signal,
      onText: ({text}) => { out.value = text; setMsg(""); } });
    out.value = ((r && r.text) || "").trim();
    setMsg("");
  }catch(e){
    const code = e && e.code;
    if(code === "cancelled") { setMsg(""); }
    else {
      if(e && e.text) out.value = e.text;
      const base = ERR[code] || "번역 중 문제가 생겼어요. 다시 시도해 주세요.";
      const detail = (code ? code : (e && e.name) || "error") + ((e && e.message) ? ": " + String(e.message).slice(0,140) : "");
      setMsg(base + "  [" + detail + "]", true);
    }
  }finally{
    busy = false; $("go").disabled = false; $("go").textContent = "번역하기";
  }
}
$("go").onclick = translate;
$("clear").onclick = () => { src.value = ""; out.value = ""; setMsg(""); synth && synth.cancel(); src.focus(); };
src.addEventListener("keydown", e => { if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); translate(); } });
</script>
</body>
</html>
