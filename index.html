<!DOCTYPE html>
<html>

<head>
    <title>Our First English Learning App</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 20px;
            padding: 12px;
            margin: 5px;
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>Vocabulary Quiz</h1>

    <p>What does "attribute to" mean?</p>

    <button onclick="checkAnswer('Ascribe to')">
        Ascribe to
    </button>

    <button onclick="checkAnswer('avoid')">
        Avoid
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            var feedback = document.getElementById("feedback");

            if (answer === "Ascribe to") {
                feedback.innerText = "잘했어!";
                feedback.style.color = "olive";
            }

            else {
                feedback.innerText = "Incorrect. The answer is Ascribe to.";
                feedback.style.color = "black";
            }

        }

    </script>

</body>
</html>
